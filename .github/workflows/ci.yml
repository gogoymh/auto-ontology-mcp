name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra postgres --extra duckdb
      - run: uv run pytest -q
        env:
          AO_TEST_PG_URL: postgresql+psycopg://postgres:pw@127.0.0.1:5432/postgres
      - name: Compare benchmark with baseline
        run: >-
          uv run python benchmarks/run_benchmark.py
          --compare benchmarks/baseline.json
          --repeats 5
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed-cache
          key: ${{ runner.os }}-fastembed-paraphrase-multilingual-MiniLM-L12-v2-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-paraphrase-multilingual-MiniLM-L12-v2-
      - name: Install semantic extra
        run: uv sync --extra semantic
      - name: Run semantic tests
        run: uv run pytest -q tests/test_semantic_search.py tests/test_benchmark_semantic_model.py
        env:
          AUTO_ONTOLOGY_EMBEDDING_CACHE: ${{ runner.temp }}/fastembed-cache
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed-cache
